<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Second Brain</title>
<style>
  html, body{
    height:100%;
    overscroll-behavior-y:none;
    -webkit-overflow-scrolling:touch;
  }
  body{
    overflow-y:auto;
    overflow-x:hidden;
  }
  :root{
    --bg:#12130f;
    --panel:#1b1d17;
    --ink:#e9e4d8;
    --ink-dim:#9a9583;
    --moss:#6f8f5c;
    --moss-bright:#9fc27f;
    --rule:#33352b;
    --danger:#b5654a;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;
    margin:0;
    padding:0 0 40px 0;
    min-height:100vh;
  }
  .wrap{max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px 0;}



  .brandrow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px;}
  .brand{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:22px;
    letter-spacing:0.2px;
    color:var(--ink);
  }
  .brand em{color:var(--moss-bright);font-style:normal;}
  .count{font-size:12px;color:var(--ink-dim);}
  .sub{color:var(--ink-dim);font-size:12.5px;margin-bottom:18px;}

  .capture{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:12px;
  }
  textarea{
    width:100%;
    min-height:90px;
    background:transparent;
    border:none;
    outline:none;
    resize:vertical;
    color:var(--ink);
    font-size:16px;
    line-height:1.4;
    font-family:inherit;
    padding:2px;
  }
  textarea::placeholder{color:#666152;}

  .hint{
    display:flex;
    gap:6px;
    align-items:center;
    font-size:11.5px;
    color:var(--ink-dim);
    padding:2px 2px 10px;
    border-bottom:1px dashed var(--rule);
    margin-bottom:10px;
  }
  .mickey{
    width:16px;height:16px;border-radius:4px;
    background:var(--rule);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:10px;flex:none;
  }

  .rowbtns{display:flex;gap:8px;}
  button{
    font-family:inherit;
    border:none;
    border-radius:10px;
    padding:12px 14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .save{
    flex:1;
    background:var(--moss);
    color:#0d1408;
  }
  .save:active{background:var(--moss-bright);}
  .clear{
    background:transparent;
    color:var(--ink-dim);
    border:1px solid var(--rule);
  }

  .status{
    font-size:12px;
    color:var(--moss-bright);
    min-height:16px;
    padding-top:8px;
    text-align:center;
  }

  .section-label{
    display:flex;align-items:center;gap:8px;
    margin:26px 0 10px;
    color:var(--ink-dim);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .section-label::after{content:"";flex:1;height:1px;background:var(--rule);}

  .day{margin-bottom:16px;}
  .day-date{
    font-size:13px;
    color:var(--moss-bright);
    margin-bottom:6px;
    font-weight:600;
  }
  .entry{
    display:flex;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--rule);
  }
  .entry-time{
    color:var(--ink-dim);
    font-size:12px;
    padding-top:2px;
    flex:none;
    width:38px;
  }
  .entry-text{
    flex:1;
    font-size:14.5px;
    line-height:1.4;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .entry-del{
    flex:none;
    background:none;
    border:none;
    color:#665c50;
    font-size:16px;
    padding:0 2px;
    cursor:pointer;
  }

  .empty{
    color:var(--ink-dim);
    font-size:13.5px;
    padding:20px 4px;
    text-align:center;
  }

  .export-box{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:12px;
  }
  .export-actions{display:flex;gap:8px;margin-bottom:10px;}
  .exp{
    flex:1;
    background:transparent;
    border:1px solid var(--moss);
    color:var(--moss-bright);
  }
  .exp-clear{
    background:transparent;
    border:1px solid var(--rule);
    color:var(--danger);
  }
  .exp-out{
    width:100%;
    min-height:0;
    height:0;
    background:#0e0f0b;
    border:1px solid var(--rule);
    border-radius:8px;
    color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;
    padding:0;
    transition:height .15s ease, padding .15s ease, min-height .15s ease;
    overflow:auto;
  }
  .exp-out.show{
    height:180px;
    min-height:180px;
    padding:10px;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="brandrow">
    <div class="brand">Second Brain <em>· Quick Capture</em></div>
    <div class="count" id="count">0 Einträge</div>
  </div>
  <div class="sub">Diktiere über die Mikrofon-Taste auf der Tastatur — kurz reinsprechen, sichern, fertig.</div>

  <div class="capture">
    <textarea id="input" placeholder="Tippen oder auf das Mikrofon-Symbol der Tastatur tippen und sprechen …" autofocus></textarea>
    <div class="hint"><span class="mickey">🎤</span> Tastatur-Diktierfunktion nutzen für schnelles Reinsprechen</div>
    <div class="rowbtns">
      <button class="save" id="saveBtn">Sichern</button>
      <button class="clear" id="clearBtn">Leeren</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="section-label">Einträge</div>
  <div id="list"></div>

  <div class="section-label">Export für Obsidian</div>
  <div class="export-box">
    <div class="export-actions">
      <button class="exp" id="exportBtn">Als Markdown anzeigen</button>
      <button class="exp-clear" id="wipeBtn">Alle löschen</button>
    </div>
    <textarea class="exp-out" id="exportOut" readonly></textarea>
  </div>
</div>

<script>
const STORAGE_KEY = 'entries';
let entries = [];

function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`; }
function fmtTime(d){ return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function dayKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

async function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){
    entries = [];
  }
  render();
}

async function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }catch(e){
    setStatus('Speichern fehlgeschlagen — bitte nochmal versuchen.', true);
  }
}

function setStatus(msg, isError){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.color = isError ? '#b5654a' : 'var(--moss-bright)';
  if(msg) setTimeout(()=>{ if(el.textContent===msg) el.textContent=''; }, 2200);
}

function render(){
  document.getElementById('count').textContent = entries.length + (entries.length===1 ? ' Eintrag' : ' Einträge');
  const list = document.getElementById('list');
  list.innerHTML = '';

  if(entries.length===0){
    list.innerHTML = '<div class="empty">Noch nichts gesichert. Dein erster Eintrag landet hier.</div>';
    return;
  }

  const groups = {};
  const order = [];
  [...entries].sort((a,b)=>b.ts-a.ts).forEach(e=>{
    const d = new Date(e.ts);
    const k = dayKey(d);
    if(!groups[k]){ groups[k]=[]; order.push(k); }
    groups[k].push(e);
  });

  order.forEach(k=>{
    const dayDiv = document.createElement('div');
    dayDiv.className = 'day';
    const dateLabel = fmtDate(new Date(groups[k][0].ts));
    dayDiv.innerHTML = `<div class="day-date">${dateLabel}</div>`;
    groups[k].forEach(e=>{
      const row = document.createElement('div');
      row.className = 'entry';
      row.innerHTML = `
        <div class="entry-time">${fmtTime(new Date(e.ts))}</div>
        <div class="entry-text"></div>
        <button class="entry-del" data-id="${e.id}">✕</button>
      `;
      row.querySelector('.entry-text').textContent = e.text;
      dayDiv.appendChild(row);
    });
    list.appendChild(dayDiv);
  });

  list.querySelectorAll('.entry-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-id');
      entries = entries.filter(e=>String(e.id)!==id);
      await persist();
      render();
    });
  });
}

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const ta = document.getElementById('input');
  const text = ta.value.trim();
  if(!text) return;
  entries.push({ id: Date.now(), ts: Date.now(), text });
  ta.value = '';
  ta.blur();
  window.scrollTo(0, 0);
  await persist();
  render();
  setStatus('Gesichert ✓', false);
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  document.getElementById('input').value = '';
});

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const out = document.getElementById('exportOut');
  if(entries.length===0){
    out.value = 'Keine Einträge vorhanden.';
  } else {
    const groups = {};
    const order = [];
    [...entries].sort((a,b)=>a.ts-b.ts).forEach(e=>{
      const d = new Date(e.ts);
      const k = dayKey(d);
      if(!groups[k]){ groups[k]=[]; order.push(k); }
      groups[k].push(e);
    });
    let md = '';
    order.forEach(k=>{
      md += `## ${fmtDate(new Date(groups[k][0].ts))}\n`;
      groups[k].forEach(e=>{
        md += `- **${fmtTime(new Date(e.ts))}** ${e.text}\n`;
      });
      md += '\n';
    });
    out.value = md.trim();
  }
  out.classList.add('show');
  out.focus();
  out.select();
  try{
    document.execCommand('copy');
    setStatus('In Zwischenablage kopiert ✓', false);
  }catch(e){
    setStatus('Markiert — manuell kopieren (Cmd/长按 → Kopieren)', false);
  }
});

document.getElementById('wipeBtn').addEventListener('click', async ()=>{
  if(entries.length===0) return;
  if(!confirm('Wirklich alle Einträge löschen? Nur machen, wenn du sie schon gesichert/exportiert hast.')) return;
  entries = [];
  await persist();
  render();
  document.getElementById('exportOut').classList.remove('show');
  document.getElementById('exportOut').value = '';
  setStatus('Alles gelöscht.', false);
});

load();
</script>

</body>
</html>
